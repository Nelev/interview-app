[project]
name = "interview-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai>=3.3.1",
    "python-dotenv>=1.2.3",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The app is a flat module tree at the project root, not an installed package,
# so the root has to be importable for "import main" to resolve.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
